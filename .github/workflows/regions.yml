name: Gebiete vorbauen
# Builds map areas in advance (Tirol first, then other touring areas) with the app's own code in
# headless Chromium and uploads them to Cloudflare R2 (bucket firstline-regions), where the app loads them.
# Areas already built are kept, so running it again only adds new ones until the size budget is reached.
on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Größe gesamt in MB"
        default: "3000"
      minutes:
        description: "Bauzeit in Minuten"
        default: "300"
      fresh:
        description: "Alle Gebiete neu bauen (ja/nein)"
        default: "nein"
permissions:
  contents: write
  actions: write
env:
  PUBLIC: https://pub-f6e66f80d8cf4bc2851ce63a42cee5f4.r2.dev
concurrency:
  group: regions
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Zugang zu Cloudflare prüfen
        env:
          K: ${{ secrets.R2_ACCESS_KEY_ID }}
          S: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          E: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -z "$K" ] || [ -z "$S" ] || [ -z "$E" ]; then echo "::error::Secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY und R2_ENDPOINT fehlen"; exit 1; fi
      - name: Hochladen nach R2 testen
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          command -v aws >/dev/null || pip install --quiet awscli
          EP="${R2_ENDPOINT%/}"; EP="${EP%/firstline-regions}"
          echo "ok $(date -u +%FT%TZ)" > probe.txt
          aws s3 cp probe.txt s3://firstline-regions/probe.txt --endpoint-url "$EP" --content-type text/plain
          sleep 3; curl -sSf "$PUBLIC/probe.txt"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chromium
        run: |
          cd tools && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Bisherige Gebiete laden
        if: ${{ inputs.fresh != 'ja' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/b2
          # index of what is already on Cloudflare R2; the first time, the areas from the GitHub release
          if curl -sSf "$PUBLIC/b2/index.json" -o out/b2/index.json; then echo "REMOTE=1" >> $GITHUB_ENV; echo "R2: $(grep -o '"keys":\[[^]]*' out/b2/index.json | tr ',' '\n' | wc -l) Gebiete";
          elif gh release download regions -p regions.tar -D /tmp; then tar -xf /tmp/regions.tar -C out && rm /tmp/regions.tar; ls out/b2 | wc -l; fi
      - name: Bauen
        run: |
          mkdir -p out/b2
          node tools/prebuild.mjs out/b2 "${{ inputs.budget || '3000' }}" "${{ inputs.minutes || '300' }}"
          du -sh out/b2
      - name: Nach Cloudflare R2 hochladen
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          test -f out/b2/index.json || exit 0
          command -v aws >/dev/null || pip install --quiet awscli
          EP="${R2_ENDPOINT%/}"; EP="${EP%/firstline-regions}"
          # areas first (cached a week), the index last, so it never lists a file that is not there yet
          aws s3 sync out/b2 s3://firstline-regions/b2 --endpoint-url "$EP" --exclude index.json --size-only \
            --content-type application/octet-stream --cache-control "public, max-age=604800" --only-show-errors
          aws s3 cp out/b2/index.json s3://firstline-regions/b2/index.json --endpoint-url "$EP" \
            --content-type application/json --cache-control "public, max-age=300"
          echo "::notice title=R2::$(ls out/b2/*.bin 2>/dev/null | wc -l) Dateien hochgeladen"
